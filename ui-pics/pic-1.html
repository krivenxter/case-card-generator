<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Схематичная иллюстрация</title>
<style>
@font-face {
  font-family:"Museo Cyrl Sans";
  font-style:normal;
  font-weight:500;
  font-display:swap;
  src:url("assets/fonts/museosanscyrl-500.woff2") format("woff2"),
      url("../fonts/museosanscyrl-500.woff2") format("woff2"),
      url("https://calltouch-public.website.yandexcloud.net/fonts/museosanscyrl-500.woff2") format("woff2");
}
:root {
  --page-bg:#fff;
  --bg:#F2F7FA;
  --frame-bg:var(--bg);
  --plate-bg:#fff;
  --ink:#1F282C;
  --accent:#22B8DE;
  --accent-soft:#DDF5FA;
  --accent-deep:#087EAD;
  --mint:#20A88A;
  --line:#E0EAF0;
  --skeleton:#E4EDF2;
  --card-shadow:0 18px 18px rgba(73,153,190,.22);
  --connector-width:12px;
  --arrowhead-size:24px;
  --ft:"Museo Cyrl Sans",system-ui,sans-serif;
}
* { box-sizing:border-box; }
body {
  margin:0;
  background:var(--page-bg);
  font-family:var(--ft);
  font-weight:500;
}
.workspace {
  width:min(100%,960px);
  margin:0 auto;
  padding-top:24px;
}
.scene-frame {
  position:relative;
  width:100%;
  height:380px;
  overflow:hidden;
  background:var(--frame-bg);
  padding:20px;
}
.scene-frame[data-mode="blue-plates"] {
  --frame-bg:#fff;
  --plate-bg:#F2F7FA;
}
.connector-layer {
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  z-index:1;
  pointer-events:none;
}
.connector-layer > .connector-path {
  fill:none;
  stroke-width:var(--connector-width);
  stroke-linecap:round;
  stroke-linejoin:round;
}
.arrowhead { stroke:none; }
.connector-blue { color:var(--accent); }
.connector-mint { color:var(--mint); }
.node,
.hub,
.result {
  position:absolute;
  z-index:2;
  background:var(--plate-bg);
  border:1px solid var(--line);
  box-shadow:var(--card-shadow);
}
.node {
  width:132px;
  height:66px;
  border-radius:18px;
  padding:8px;
  display:flex;
  align-items:center;
  gap:10px;
}
.node-a { left:36px; top:36px; }
.node-b { left:36px; top:117px; }
.node-c { left:36px; top:198px; }
.node-d { left:36px; top:279px; }
.node-skeletons {
  display:flex;
  flex:1;
  min-width:0;
  flex-direction:column;
  gap:7px;
}
.node-skeleton {
  display:block;
  height:8px;
  border-radius:8px;
  background:var(--skeleton);
}
.node-skeleton.short { width:62%; }
.node-skeleton.medium { width:88%; }
.hub {
  left:380px;
  top:110px;
  width:200px;
  height:160px;
  border-radius:24px;
  padding:24px;
  display:flex;
  align-items:center;
  gap:18px;
}
.result {
  left:680px;
  top:120px;
  width:170px;
  height:140px;
  border-radius:24px;
  padding:24px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:16px;
}
.icon-tile {
  width:48px;
  height:48px;
  flex:none;
  display:grid;
  place-items:center;
  border-radius:10px;
  background:var(--accent-soft);
  color:var(--accent-deep);
}
.hub .icon-tile {
  width:72px;
  height:72px;
  border-radius:18px;
  background:var(--accent);
  color:#fff;
}
.result .icon-tile {
  background:#DDF4EE;
  color:var(--mint);
}
svg.lucide {
  width:32px;
  height:32px;
  fill:none;
  stroke:currentColor;
  stroke-width:2.5;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.hub svg.lucide { width:44px; height:44px; }
.result svg.lucide { width:38px; height:38px; }
.skeletons {
  display:flex;
  flex-direction:column;
  gap:9px;
  width:100%;
}
.skeleton {
  display:block;
  height:10px;
  border-radius:9px;
  background:var(--skeleton);
}
.skeleton.short { width:58%; }
.skeleton.medium { width:76%; }
.skeleton.long { width:92%; }
.hub .skeletons { gap:12px; }
.hub .skeleton { height:12px; }
.result .skeleton { height:11px; }
.result .skeleton:first-child { background:#BDEBE0; }
@media (max-width:700px) {
  .scene-frame {
    height:560px;
    padding:20px;
    --arrowhead-size:16px;
  }
  .node {
    width:140px;
  }
  .node-a { left:24px; top:36px; }
  .node-b { left:24px; top:150px; }
  .node-c { left:calc(100% - 164px); top:36px; }
  .node-d { left:calc(100% - 164px); top:150px; }
  .hub {
    left:50%;
    top:282px;
    width:220px;
    height:150px;
    transform:translateX(-50%);
  }
  .result {
    left:50%;
    top:462px;
    width:170px;
    height:110px;
    transform:translateX(-50%);
    flex-direction:row;
    align-items:center;
  }
  .desktop-connectors { display:none; }
  .mobile-connectors { display:block; }
}
.mobile-connectors { display:none; }
.export-row {
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:20px;
}
.export-btn {
  display:inline-flex;
  align-items:center;
  gap:6px;
  min-height:36px;
  padding:8px 15px;
  border-radius:10px;
  font-family:var(--ft);
  font-size:13px;
  font-weight:600;
  cursor:pointer;
}
.export-btn:focus-visible {
  outline:3px solid #96DCEB;
  outline-offset:2px;
}
.export-copy {
  color:var(--ink);
  background:#F2F7FA;
  border:1px solid var(--line);
}
.export-png {
  color:#fff;
  background:var(--accent);
  border:1px solid var(--accent);
}
.theme-toggle {
  color:var(--ink);
  background:#fff;
  border:1px solid #DDE8EE;
}
</style>
</head>
<body>

      </defs>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <div class="export-row">

      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
      Скопировать HTML
    </button>
    <button type="button" class="export-btn export-png" id="save-png">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
      Сохранить PNG ×2
    </button>
  </div>
</main>

<script>
(() => {
  const frame = document.getElementById('illus');
  const toggle = document.getElementById('theme-toggle');
  const copy = document.getElementById('copy-html');
  const save = document.getElementById('save-png');

  const arrowSize = parseFloat(getComputedStyle(frame).getPropertyValue('--arrowhead-size')) || 24;
  const point = value => value.trim().split(/\s+/).map(Number);
  document.querySelectorAll('.connector-path').forEach(path => {
    const [sx, sy] = point(path.dataset.start);
    const [c1x, c1y] = point(path.dataset.c1);
    const [c2x, c2y] = point(path.dataset.c2);
    const [tx, ty] = point(path.dataset.tip);
    const dx = tx - c2x;
    const dy = ty - c2y;
    const length = Math.hypot(dx, dy) || 1;
    const baseX = tx - dx / length * arrowSize;
    const baseY = ty - dy / length * arrowSize;
    path.setAttribute('d', `M${sx} ${sy} C${c1x} ${c1y} ${c2x} ${c2y} ${baseX} ${baseY}`);
  });
  document.querySelectorAll('.arrowhead').forEach(arrow => {
    const [c2x, c2y] = point(arrow.dataset.c2);
    const [tx, ty] = point(arrow.dataset.tip);
    const angle = Math.atan2(ty - c2y, tx - c2x) * 180 / Math.PI;
    arrow.setAttribute('transform', `translate(${tx} ${ty}) rotate(${angle}) scale(${arrowSize / 24})`);
  });

  const sync = () => {
    const inverse = frame.dataset.mode === 'blue-plates';
    toggle.textContent = inverse ? 'Режим: голубые плашки' : 'Режим: белые плашки';
    toggle.setAttribute('aria-pressed', String(inverse));
  };

  toggle.addEventListener('click', () => {
    frame.dataset.mode = frame.dataset.mode === 'blue-plates' ? 'white-plates' : 'blue-plates';
    sync();
  });

  copy.addEventListener('click', () => {
    navigator.clipboard.writeText(frame.outerHTML).then(() => {
      copy.textContent = 'Скопировано!';
      setTimeout(() => copy.textContent = 'Скопировать HTML', 2000);
    });
  });

  save.addEventListener('click', () => {
    const oldText = save.textContent;
    save.textContent = 'Рендерим...';
    const bg = getComputedStyle(frame).backgroundColor || '#F2F7FA';

    const download = url => {
      const link = document.createElement('a');
      link.download = 'illustration.png';
      link.href = url;
      link.click();
    };

    const fallback = () => html2canvas(frame, {
      scale:2,
      useCORS:true,
      allowTaint:false,
      foreignObjectRendering:true,
      backgroundColor:bg,
      onclone:doc => {
        doc.querySelectorAll('*').forEach(node => {
          node.style.transition = 'none';
          node.style.animation = 'none';
        });
        doc.querySelectorAll('.node, .hub, .result').forEach(node => {
          node.style.boxShadow = '0 18px 18px rgba(73,153,190,.22)';
        });
      }
    }).then(canvas => canvas.toDataURL('image/png'));

    const render = () => window.htmlToImage && typeof htmlToImage.toPng === 'function'
      ? htmlToImage.toPng(frame, {pixelRatio:2, cacheBust:true, backgroundColor:bg}).catch(fallback)
      : fallback();

    document.fonts.ready.then(() => {
      setTimeout(() => {
        render().then(download).then(() => {
          save.textContent = oldText;
        }).catch(() => {
          save.textContent = 'Ошибка экспорта';
          setTimeout(() => save.textContent = oldText, 2500);
        });
      }, 300);
    });
  });

  sync();
})();
</script>
</body>
</html>
