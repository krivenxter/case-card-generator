<!DOCTYPE html>

<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Единое окно сообщений</title>

<style>

@font-face {

  font-family:"Museo Cyrl Sans";

  font-style:normal;

  font-weight:300;

  font-display:swap;

  src:url("assets/fonts/museosanscyrl-300.woff2") format("woff2"),

      url("../fonts/museosanscyrl-300.woff2") format("woff2"),

      url("https://calltouch-public.website.yandexcloud.net/fonts/museosanscyrl-300.woff2") format("woff2");

}

@font-face {

  font-family:"Museo Cyrl Sans";

  font-style:normal;

  font-weight:500;

  font-display:swap;

  src:url("assets/fonts/museosanscyrl-500.woff2") format("woff2"),

      url("../fonts/museosanscyrl-500.woff2") format("woff2"),

      url("https://calltouch-public.website.yandexcloud.net/fonts/museosanscyrl-500.woff2") format("woff2");

}

@font-face {

  font-family:"Museo Cyrl Sans";

  font-style:normal;

  font-weight:700;

  font-display:swap;

  src:url("assets/fonts/museosanscyrl-700.woff2") format("woff2"),

      url("../fonts/museosanscyrl-700.woff2") format("woff2"),

      url("https://calltouch-public.website.yandexcloud.net/fonts/museosanscyrl-700.woff2") format("woff2");

}

@font-face {

  font-family:"Dela Gothic One";

  font-style:normal;

  font-weight:400;

  font-display:swap;

  src:url("assets/fonts/DelaGothicOne-Regular.ttf") format("truetype"),

      url("../fonts/DelaGothicOne-Regular.ttf") format("truetype"),

      url("https://calltouch-public.website.yandexcloud.net/fonts/DelaGothicOne-Regular.ttf") format("truetype");

}



:root {

  --page-bg:#fff;

  --bg:#F2F7FA;

  --frame-bg:var(--bg);

  --plate-bg:#fff;

  --ink:#1F282C;

  --accent:#22B8DE;

  --accent-soft:#B8EAF4;

  --accent-deep:#0797C0;

  --skeleton:#E4EDF2;

  --line:#E0EAF0;

  --card-shadow:0 18px 18px rgba(73,153,190,.22);

  --connector-width:12px;

  --arrowhead-size:24px;

  --ft:"Museo Cyrl Sans",system-ui,sans-serif;

  --fd:"Dela Gothic One",system-ui,sans-serif;

}







{ box-sizing:border-box; }



body {

  margin:0;

  background:var(--page-bg);

  color:var(--ink);

  font-family:var(--ft);

  font-weight:500;

}



.workspace {

  width:min(100%,960px);

  margin:0 auto;

  padding-top:24px;

}



.scene-frame {

  position:relative;

  width:100%;

  aspect-ratio:960 / 420;

  min-height:320px;

  overflow:hidden;

  padding:20px 20px 0;

  background:var(--frame-bg);

}



.scene-frame[data-mode="blue-plates"] {

  --frame-bg:#fff;

  --plate-bg:#F2F7FA;

}



.scene-inner {

  position:relative;

  width:100%;

  height:100%;

  max-width:960px;

  margin:0 auto;

  overflow:hidden;

}



.connector-layer {

  position:absolute;

  inset:0;

  width:100%;

  height:100%;

  z-index:1;

  overflow:visible;

}



.connector-path {

  fill:none;

  stroke-width:var(--connector-width);

  stroke-linecap:round;

  stroke-linejoin:round;

}



.arrowhead {

  stroke:none;

}



.node,

.hub {

  position:absolute;

  z-index:3;

  background:var(--plate-bg);

  border:1px solid var(--line);

  box-shadow:var(--card-shadow);

}



.node {

  width:120px;

  height:120px;

  border-radius:18px;

  display:flex;

  align-items:center;

  justify-content:center;

}



.node-left-1 { left:36px; top:42px; }

.node-left-2 { left:36px; top:218px; }

.node-right-1 { right:36px; top:42px; }

.node-right-2 { right:36px; top:218px; }



.node-icon {

  width:64px;

  height:64px;

  border-radius:18px;

  display:flex;

  align-items:center;

  justify-content:center;

  color:#fff;

  box-shadow:0 12px 16px rgba(73,153,190,.20);

}



.node-icon.cyan {

  background:linear-gradient(145deg,#9CE7F2 0%,#22B8DE 55%,#0797C0 100%);

}

.node-icon.deep {

  background:linear-gradient(145deg,#B8EAF4 0%,#4CCBE4 52%,#128EAF 100%);

}



.node-icon svg {

  width:34px;

  height:34px;

  stroke:currentColor;

  stroke-width:2.3;

  fill:none;

  stroke-linecap:round;

  stroke-linejoin:round;

}



.hub {

  left:300px;

  top:48px;

  width:360px;

  height:284px;

  border-radius:24px;

  padding:28px 30px;

}



.hub-top {

  display:flex;

  align-items:center;

  gap:18px;

  height:72px;

}



.hub-symbol {

  width:72px;

  height:72px;

  flex:0 0 72px;

  border-radius:18px;

  display:flex;

  align-items:center;

  justify-content:center;

  color:#fff;

  background:linear-gradient(145deg,#B8EAF4 0%,#22B8DE 58%,#0797C0 100%);

  box-shadow:0 12px 16px rgba(73,153,190,.22);

}



.hub-symbol svg {

  width:40px;

  height:40px;

  stroke:currentColor;

  stroke-width:2.3;

  fill:none;

  stroke-linecap:round;

  stroke-linejoin:round;

}



.hub-lines {

  flex:1;

  display:flex;

  flex-direction:column;

  gap:12px;

}



.skeleton {

  height:14px;

  border-radius:9px;

  background:var(--skeleton);

}

.skeleton.long { width:100%; }

.skeleton.medium { width:72%; }

.skeleton.short { width:48%; }



.hub-body {

  margin-top:30px;

  display:flex;

  flex-direction:column;

  gap:16px;

}



.message-row {

  height:42px;

  border-radius:10px;

  background:#F4F8FA;

  display:flex;

  align-items:center;

  gap:14px;

  padding:0 14px;

}



.message-row.accent {

  background:#DDF5FA;

}



.row-icon {

  width:28px;

  height:28px;

  border-radius:8px;

  background:var(--accent);

  color:#fff;

  display:flex;

  align-items:center;

  justify-content:center;

  flex:0 0 28px;

}



.row-icon svg {

  width:17px;

  height:17px;

  stroke:currentColor;

  stroke-width:2.6;

  fill:none;

  stroke-linecap:round;

  stroke-linejoin:round;

}



.row-lines {

  display:flex;

  flex-direction:column;

  gap:7px;

  flex:1;

}



.row-lines .skeleton {

  height:8px;

}



.check-state {

  width:28px;

  height:28px;

  border-radius:50%;

  background:#20A88A;

  color:#fff;

  display:flex;

  align-items:center;

  justify-content:center;

  flex:0 0 28px;

}



.check-state svg {

  width:17px;

  height:17px;

  stroke:currentColor;

  stroke-width:3;

  fill:none;

  stroke-linecap:round;

  stroke-linejoin:round;

}



@media (max-width:700px) {

  .workspace { padding-top:16px; }

  .scene-frame {

    min-height:260px;

    padding:12px 12px 0;

  }

  .node {

    width:86px;

    height:86px;

    border-radius:14px;

  }

  .node-left-1 { left:12px; top:32px; }

  .node-left-2 { left:12px; top:160px; }

  .node-right-1 { right:12px; top:32px; }

  .node-right-2 { right:12px; top:160px; }

  .node-icon {

    width:48px;

    height:48px;

    border-radius:14px;

  }

  .node-icon svg { width:27px; height:27px; }

  .hub {

    left:50%;

    top:24px;

    width:42%;

    height:230px;

    padding:18px;

    transform:translateX(-50%);

    border-radius:18px;

  }

  .hub-top { gap:10px; height:52px; }

  .hub-symbol {

    width:52px;

    height:52px;

    flex-basis:52px;

    border-radius:14px;

  }

  .hub-symbol svg { width:29px; height:29px; }

  .hub-body { margin-top:22px; gap:10px; }

  .message-row { height:34px; gap:8px; padding:0 8px; }

  .row-icon,

  .check-state {

    width:22px;

    height:22px;

    flex-basis:22px;

  }

  .row-icon svg,

  .check-state svg { width:13px; height:13px; }

  .row-lines { gap:5px; }

  .row-lines .skeleton { height:6px; }

  .connector-layer { transform:scale(.98); transform-origin:center; }

}



.export-row {

  display:flex;

  flex-wrap:wrap;

  gap:10px;

  margin-top:20px;

  padding-bottom:24px;

}



.export-btn {

  display:inline-flex;

  align-items:center;

  gap:6px;

  min-height:36px;

  padding:8px 15px;

  border-radius:10px;

  font-family:var(--ft);

  font-size:13px;

  font-weight:600;

  cursor:pointer;

}

.export-btn:focus-visible {

  outline:3px solid #A7E8F3;

  outline-offset:2px;

}

.export-copy {

  background:#F2F7FA;

  color:#1F282C;

  border:1px solid #DDE8EE;

}

.export-png {

  background:#22B8DE;

  color:#fff;

  border:1px solid #22B8DE;

}

.theme-toggle {

  background:#fff;

  color:#1F282C;

  border:1px solid #DDE8EE;

}

</style>

</head>

<body>

<main class="workspace">

  <section id="illus" class="scene-frame" data-mode="white-plates" aria-label="Единое окно для сообщений из разных каналов">

    <div class="scene-inner">

      <svg class="connector-layer" viewBox="0 0 960 420" aria-hidden="true">

        <defs>

          <linearGradient id="grad-left-top" x1="0" y1="0" x2="1" y2="0">

            <stop offset="0%" stop-color="#B8EAF4"/>

            <stop offset="100%" stop-color="#22B8DE"/>

          </linearGradient>

          <linearGradient id="grad-left-bottom" x1="0" y1="0" x2="1" y2="0">

            <stop offset="0%" stop-color="#C9EEF5"/>

            <stop offset="100%" stop-color="#22B8DE"/>

          </linearGradient>

          <linearGradient id="grad-right-top" x1="1" y1="0" x2="0" y2="0">

            <stop offset="0%" stop-color="#B8EAF4"/>

            <stop offset="100%" stop-color="#22B8DE"/>

          </linearGradient>

          <linearGradient id="grad-right-bottom" x1="1" y1="0" x2="0" y2="0">

            <stop offset="0%" stop-color="#C9EEF5"/>

            <stop offset="100%" stop-color="#22B8DE"/>

          </linearGradient>

        </defs>



        <path class="connector-path" d="M166 102 C220 102 228 112 266 112" stroke="url(#grad-left-top)"/>

        <path class="arrowhead" d="M266 100 L290 112 L266 124 Z" fill="#22B8DE"/>



        <path class="connector-path" d="M166 278 C220 278 228 260 266 260" stroke="url(#grad-left-bottom)"/>

        <path class="arrowhead" d="M266 248 L290 260 L266 272 Z" fill="#22B8DE"/>



        <path class="connector-path" d="M794 102 C740 102 732 112 694 112" stroke="url(#grad-right-top)"/>

        <path class="arrowhead" d="M694 100 L670 112 L694 124 Z" fill="#22B8DE"/>



        <path class="connector-path" d="M794 278 C740 278 732 260 694 260" stroke="url(#grad-right-bottom)"/>

        <path class="arrowhead" d="M694 248 L670 260 L694 272 Z" fill="#22B8DE"/>

      </svg>



      <div class="node node-left-1" aria-label="Телефонный канал">

        <div class="node-icon cyan">

          <svg viewBox="0 0 24 24">

            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.9.33 1.78.62 2.63a2 2 0 0 1-.45 2.11L8 9.73a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.85.29 1.73.5 2.63.62A2 2 0 0 1 22 16.92z"/>

          </svg>

        </div>

      </div>



      <div class="node node-left-2" aria-label="Сообщения">

        <div class="node-icon deep">

          <svg viewBox="0 0 24 24">

            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8z"/>

          </svg>

        </div>

      </div>



      <div class="node node-right-1" aria-label="Социальные сети">

        <div class="node-icon deep">

          <svg viewBox="0 0 24 24">

            <circle cx="12" cy="12" r="10"/>

            <line x1="2" y1="12" x2="22" y2="12"/>

            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>

          </svg>

        </div>

      </div>



      <div class="node node-right-2" aria-label="Классифайды">

        <div class="node-icon cyan">

          <svg viewBox="0 0 24 24">

            <path d="m3 11 18-5v12L3 14v-3z"/>

            <path d="M11.6 16.8a3 3 0 0 1-5.8-1.6"/>

            <path d="M21 12H3"/>

          </svg>

        </div>

      </div>



      <div class="hub" aria-label="Объединённый рабочий экран">

        <div class="hub-top">

          <div class="hub-symbol">

            <svg viewBox="0 0 24 24">

              <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8z"/>

            </svg>

          </div>

          <div class="hub-lines" aria-hidden="true">

            <div class="skeleton long"></div>

            <div class="skeleton medium"></div>

          </div>

        </div>



        <div class="hub-body">

          <div class="message-row accent">

            <div class="row-icon">

              <svg viewBox="0 0 24 24">

                <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8z"/>

              </svg>

            </div>

            <div class="row-lines" aria-hidden="true">

              <div class="skeleton long"></div>

              <div class="skeleton short"></div>

            </div>

            <div class="check-state">

              <svg viewBox="0 0 24 24">

                <polyline points="20 6 9 17 4 12"/>

              </svg>

            </div>

          </div>



          <div class="message-row">

            <div class="row-icon">

              <svg viewBox="0 0 24 24">

                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.9.33 1.78.62 2.63a2 2 0 0 1-.45 2.11L8 9.73a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.85.29 1.73.5 2.63.62A2 2 0 0 1 22 16.92z"/>

              </svg>

            </div>

            <div class="row-lines" aria-hidden="true">

              <div class="skeleton medium"></div>

              <div class="skeleton short"></div>

            </div>

            <div class="check-state">

              <svg viewBox="0 0 24 24">

                <polyline points="20 6 9 17 4 12"/>

              </svg>

            </div>

          </div>



          <div class="message-row">

            <div class="row-icon">

              <svg viewBox="0 0 24 24">

                <circle cx="12" cy="12" r="10"/>

                <line x1="2" y1="12" x2="22" y2="12"/>

                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>

              </svg>

            </div>

            <div class="row-lines" aria-hidden="true">

              <div class="skeleton long"></div>

              <div class="skeleton medium"></div>

            </div>

            <div class="check-state">

              <svg viewBox="0 0 24 24">

                <polyline points="20 6 9 17 4 12"/>

              </svg>

            </div>

          </div>

        </div>

      </div>

    </div>

  </section>



  <div class="export-row">

    <button type="button" class="export-btn theme-toggle" id="theme-toggle" aria-pressed="false">Режим: белые плашки</button>

    <button type="button" class="export-btn export-copy" id="copy-html">

      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

        <rect x="9" y="9" width="13" height="13" rx="2"/>

        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>

      </svg>

      Скопировать HTML

    </button>

    <button type="button" class="export-btn export-png" id="export-png">

      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>

        <polyline points="7 10 12 15 17 10"/>

        <line x1="12" y1="15" x2="12" y2="3"/>

      </svg>

      Сохранить PNG ×2

    </button>

  </div>

</main>



<script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script>

(() => {

  const frame = document.getElementById('illus');

  const toggle = document.getElementById('theme-toggle');

  const copy = document.getElementById('copy-html');

  const png = document.getElementById('export-png');



  const syncTheme = () => {

    const inverse = frame.dataset.mode === 'blue-plates';

    toggle.textContent = inverse ? 'Режим: голубые плашки' : 'Режим: белые плашки';

    toggle.setAttribute('aria-pressed', String(inverse));

  };



  toggle.addEventListener('click', () => {

    frame.dataset.mode = frame.dataset.mode === 'blue-plates'

      ? 'white-plates'

      : 'blue-plates';

    syncTheme();

  });



  copy.addEventListener('click', () => {

    navigator.clipboard.writeText(frame.outerHTML).then(() => {

      copy.textContent = 'Скопировано!';

      setTimeout(() => {

        copy.textContent = 'Скопировать HTML';

      }, 2000);

    });

  });



  png.addEventListener('click', () => {

    png.textContent = 'Рендерим...';

    const bg = getComputedStyle(frame).backgroundColor || '#F2F7FA';



    const save = (url) => {

      const a = document.createElement('a');

      a.download = 'illustration.png';

      a.href = url;

      a.click();

    };



    const fallback = () => html2canvas(frame, {

      scale:2,

      useCORS:true,

      allowTaint:false,

      foreignObjectRendering:true,

      backgroundColor:bg,

      onclone:(doc) => {

        doc.querySelectorAll('*').forEach(node => {

          node.style.transition = 'none';

          node.style.animation = 'none';

        });

        doc.querySelectorAll('.node, .hub, .message-row, .node-icon, .hub-symbol').forEach(node => {

          node.style.boxShadow = getComputedStyle(node).boxShadow;

        });

      }

    }).then(canvas => canvas.toDataURL('image/png'));



    const render = () => {

      if (window.htmlToImage && typeof htmlToImage.toPng === 'function') {

        return htmlToImage.toPng(frame, {

          pixelRatio:2,

          cacheBust:true,

          backgroundColor:bg

        }).catch(fallback);

      }

      return fallback();

    };



    document.fonts.ready.then(() => {

      setTimeout(() => {

        render().then(save).then(() => {

          png.textContent = 'Сохранить PNG ×2';

        }).catch(() => {

          png.textContent = 'Ошибка экспорта';

          setTimeout(() => {

            png.textContent = 'Сохранить PNG ×2';

          }, 2500);

        });

      }, 300);

    });

  });



  syncTheme();

})();

</script>

</body>

</html>
